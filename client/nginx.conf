server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The PRD allows uploads up to 10 MB. nginx's default limit is 1 MB.
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # /api/v1/... is forwarded unchanged to the API. API_UPSTREAM has no trailing slash, so the path is kept.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files can be cached for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other path serves index.html, so /welcome and /leads/12 survive a refresh.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
