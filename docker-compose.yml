# One command for the whole stack:  docker compose up --build
# Open http://localhost:8080 (or the port set as WEB_PORT in .env)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs *.sql files in name order, only when the data volume is empty (001, 002, then any seed).
      - ./server/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    environment:
      API_UPSTREAM: http://api:4000/
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
